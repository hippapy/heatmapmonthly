<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>섹터 로테이션 히트맵 | 국내 주식시장 세부업종 월별 수익률</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f172a;
    --surface: #1a2438;
    --surface2: #24304a;
    --surface3: #2e3c5c;
    --border: #34405e;
    --text: #eef1f8;
    --text-dim: #9aa7c2;
    --text-muted: #6b7794;
    --accent: #5b8def;
    --up: #3fbf7f;
    --down: #ef5b5b;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Malgun Gothic', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-width: 1280px;
  }

  .wrap { max-width: 1760px; margin: 0 auto; padding: 20px 24px 60px; }

  /* ---------- Header ---------- */
  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .title-block h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .title-block .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

  .sample-banner {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #3a2c12;
    border: 1px solid #6b4f1a;
    color: #f0c674;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls label { font-size: 12px; color: var(--text-dim); }
  select, button {
    font-family: inherit;
    font-size: 13px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }
  select:hover, button:hover { background: var(--surface3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08122a; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; }

  /* ---------- Summary cards ---------- */
  .summary {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .summary-card h3 { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-name { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .summary-val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .summary-val.up { color: var(--up); }
  .summary-val.down { color: var(--down); }

  /* ---------- Layout: filter panel + table ---------- */
  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }

  .filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    position: sticky;
    top: 16px;
  }
  .filter-panel h3 { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .filter-actions { display: flex; gap: 6px; margin-bottom: 10px; }
  .filter-actions button { flex: 1; font-size: 11px; padding: 5px 6px; }
  .sector-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 4px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    user-select: none;
  }
  .sector-check:hover { background: var(--surface2); }
  .sector-check input { accent-color: var(--accent); cursor: pointer; }
  .sector-check .dot { width: 11px; height: 11px; }
  .sector-check span.name { flex: 1; }

  /* ---------- Table ---------- */
  .table-outer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 11.5px;
    font-weight: 600;
    padding: 9px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    z-index: 2;
  }
  thead th.sector-col {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 3;
    text-align: left;
    min-width: 168px;
  }
  tbody th.sector-col {
    position: sticky;
    left: 0;
    background: var(--surface);
    z-index: 1;
    text-align: left;
    padding: 7px 10px;
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  tbody th.sector-col .row-label { display: flex; align-items: center; gap: 8px; }
  td.cell {
    position: relative;
    min-width: 58px;
    height: 40px;
    text-align: center;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid rgba(255,255,255,0.03);
    color: #f4f6fb;
    transition: filter 0.15s ease;
  }
  td.cell .rank-badge {
    position: absolute;
    top: 2px;
    left: 3px;
    font-size: 8.5px;
    line-height: 1;
    color: rgba(255,255,255,0.55);
    font-weight: 700;
  }
  td.cell .val { display: block; padding-top: 4px; }
  td.cell.negative { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,0.22) 0 3px, transparent 3px 7px); background-blend-mode: multiply; }
  td.cell.negative .val::before { content: ''; }
  td.cell.na { color: var(--text-muted); }
  tr.dimmed td.cell, tr.dimmed th.sector-col { filter: grayscale(1); opacity: 0.28; }
  tr.dimmed th.sector-col { background: var(--surface); }

  tbody tr:hover td.cell, tbody tr:hover th.sector-col { filter: brightness(1.12); }
  tr.dimmed:hover td.cell, tr.dimmed:hover th.sector-col { filter: grayscale(1) brightness(1.1); opacity: 0.4; }

  .table-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .legend-strip {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 14px 0 4px;
    font-size: 11.5px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .legend-strip .item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 16px; height: 12px; border-radius: 3px; }
  .legend-strip .neg-pattern { background: hsl(220 10% 45%); background-image: repeating-linear-gradient(135deg, rgba(0,0,0,0.35) 0 3px, transparent 3px 7px); }

  footer.page-footer { margin-top: 20px; font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }
</style>
</head>

<div class="wrap">

  <header class="top">
    <div class="title-block">
      <h1>섹터 로테이션 히트맵 — 국내 주식시장 세부업종 월별 수익률</h1>

        <span id="asOfLabel"></span>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    월간 수익률 정의: 월말 종가 기준 전월 대비 수익률. 색상은 19개 세부업종에 색상환을 균등 분배한 고유색이며,

  </footer>

let DATA = null;
let selected = new Set();
let sortMode = 'avg'; // 'avg' | a month string like '2026-06'

async function loadData() {
  try {
    const controller = new AbortController();
    // 일부 실행 환경(파일 미리보기, 샌드박스 등)에서는 fetch가 실패도 성공도 하지 않고
    // 무한정 멈출 수 있어 하드 타임아웃으로 강제 진행시킨다.
    const timeout = setTimeout(() => controller.abort(), 2000);
    const res = await fetch('data/sector_monthly_returns.json', {
      cache: 'no-store',
      signal: controller.signal,
    });
    clearTimeout(timeout);
    if (!res.ok) throw new Error('fetch failed');
    DATA = await res.json();
  } catch (e) {
    // file:// 로 열었을 때 로컬 fetch가 CORS로 막히거나 타임아웃되는 경우 — 인라인 데이터로 폴백
    DATA = FALLBACK_DATA;
  }
  init();
}

function avgReturn(sectorId) {
  const series = DATA.returns[sectorId];
  const vals = DATA.months.map(m => series[m]).filter(v => v !== null && v !== undefined);
  if (!vals.length) return null;
  return vals.reduce((a,b) => a+b, 0) / vals.length;
}

function monthRanking(month) {
  // 전체 섹터 기준 실제 순위 (필터와 무관하게 항상 시장 전체 기준)
  const rows = DATA.sectors
    .map(s => ({ id: s.id, v: DATA.returns[s.id][month] }))
    .filter(r => r.v !== null && r.v !== undefined)
    .sort((a,b) => b.v - a.v);
  const rankMap = {};
  rows.forEach((r, i) => rankMap[r.id] = i + 1);
  return rankMap;
}

function globalMaxAbs() {
  let max = 0;
  for (const sid in DATA.returns) {
    for (const m of DATA.months) {
      const v = DATA.returns[sid][m];
      if (v !== null && v !== undefined) max = Math.max(max, Math.abs(v));
    }
  }
  return max || 1;
}

function sortedSectorIds() {
  const ids = DATA.sectors.map(s => s.id);
  if (sortMode === 'avg') {
    return ids.slice().sort((a,b) => (avgReturn(b) ?? -999) - (avgReturn(a) ?? -999));
  }
  return ids.slice().sort((a,b) => {
    const av = DATA.returns[a][sortMode], bv = DATA.returns[b][sortMode];
    return (bv ?? -999) - (av ?? -999);
  });
}

function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  const sign = v > 0 ? '+' : '';
  return `${sign}${v.toFixed(1)}%`;
}

function buildSortOptions() {
  const sel = document.getElementById('sortSelect');
  sel.innerHTML = '';
  const optAvg = document.createElement('option');
  optAvg.value = 'avg';
  optAvg.textContent = '전체 기간 평균 수익률';
  sel.appendChild(optAvg);
  DATA.months.forEach(m => {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = `${m} 기준`;
    sel.appendChild(o);
  });
  sel.value = sortMode;
  sel.addEventListener('change', () => { sortMode = sel.value; render(); });
}

function buildFilterPanel() {
  const box = document.getElementById('sectorChecklist');
  box.innerHTML = '';
  DATA.sectors.forEach(s => {
    const label = document.createElement('label');
    label.className = 'sector-check';
    label.innerHTML = `
      <input type="checkbox" data-id="${s.id}" ${selected.has(s.id) ? 'checked' : ''}>
      <span class="dot" style="background:${s.color}"></span>
      <span class="name">${s.name_kr}</span>
    `;
    label.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) selected.add(s.id); else selected.delete(s.id);
      render();
    });
    box.appendChild(label);
  });

  document.getElementById('selectAllBtn').onclick = () => {
    selected = new Set(DATA.sectors.map(s => s.id));
    buildFilterPanel();
    render();
  };
  document.getElementById('selectNoneBtn').onclick = () => {
    selected = new Set();
    buildFilterPanel();
    render();
  };
}

function renderSummary() {
  const latest = DATA.months[DATA.months.length - 1];
  const ranked = DATA.sectors
    .map(s => ({ ...s, v: DATA.returns[s.id][latest] }))
    .filter(r => r.v !== null && r.v !== undefined)
    .sort((a,b) => b.v - a.v);
  const top3 = ranked.slice(0, 3);
  const bottom3 = ranked.slice(-3).reverse();

  const card = (title, rows) => `
    <div class="summary-card">
      <h3>${title} — ${latest} 기준</h3>
      ${rows.map(r => `
        <div class="summary-row">
          <span class="summary-name"><span class="dot" style="background:${r.color}"></span>${r.name_kr}</span>
          <span class="summary-val ${r.v >= 0 ? 'up' : 'down'}">${fmtPct(r.v)}</span>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('summarySection').innerHTML =
    card('Top 3 섹터', top3) + card('Bottom 3 섹터', bottom3);
}

function render() {
  const months = DATA.months;
  const maxAbs = globalMaxAbs();
  const order = sortedSectorIds();
  const rankByMonth = {};
  months.forEach(m => rankByMonth[m] = monthRanking(m));

  // header
  const headRow = document.getElementById('headRow');
  headRow.innerHTML = `<th class="sector-col">세부업종 (${order.length}/${DATA.sectors.length})</th>` +
    months.map(m => `<th>${m}</th>`).join('');

  // body
  const bySid = Object.fromEntries(DATA.sectors.map(s => [s.id, s]));
  const bodyRows = document.getElementById('bodyRows');
  bodyRows.innerHTML = order.map(sid => {
    const s = bySid[sid];
    const dimmed = selected.size > 0 && !selected.has(sid);
    const cells = months.map(m => {
      const v = DATA.returns[sid][m];
      if (v === null || v === undefined) {
        return `<td class="cell na"><span class="val">—</span></td>`;
      }
      const alpha = Math.min(1, Math.abs(v) / maxAbs);
      const bg = s.color.replace(')', ` / ${alpha.toFixed(3)})`).replace('hsl(', 'hsl(');
      const rank = rankByMonth[m][sid];
      const negClass = v < 0 ? 'negative' : '';
      return `<td class="cell ${negClass}" style="background:${bg}">
        <span class="rank-badge">${rank ?? ''}</span>
        <span class="val">${fmtPct(v)}</span>
      </td>`;
    }).join('');
    return `<tr class="${dimmed ? 'dimmed' : ''}">
      <th class="sector-col"><span class="row-label"><span class="dot" style="background:${s.color}"></span>${s.name_kr}</span></th>
      ${cells}
    </tr>`;
  }).join('');
}

function exportCsv() {
  const months = DATA.months;
  const order = sortedSectorIds().filter(sid => selected.size === 0 || selected.has(sid));
  const bySid = Object.fromEntries(DATA.sectors.map(s => [s.id, s]));
  const header = ['세부업종', ...months];
  const lines = [header.join(',')];
  order.forEach(sid => {
    const s = bySid[sid];
    const row = [s.name_kr, ...months.map(m => {
      const v = DATA.returns[sid][m];
      return (v === null || v === undefined) ? '' : v;
    })];
    lines.push(row.join(','));
  });
  const csv = '﻿' + lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sector_heatmap_${DATA.months[0]}_${DATA.months[DATA.months.length-1]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function init() {
  selected = new Set(DATA.sectors.map(s => s.id));
  document.getElementById('periodLabel').textContent =
    `기간: ${DATA.months[0]} ~ ${DATA.months[DATA.months.length-1]} (${DATA.months.length}개월)`;
  document.getElementById('sourceLabel').textContent = `출처: ${DATA.meta.source}`;
  document.getElementById('asOfLabel').textContent = `기준일: ${DATA.meta.as_of}`;
  const emptySectors = DATA.sectors.filter(s =>
    DATA.months.every(m => DATA.returns[s.id][m] === null || DATA.returns[s.id][m] === undefined));
  const banner = document.getElementById('sampleBanner');
  if (emptySectors.length === DATA.sectors.length) {
    banner.textContent = '⚠ 샘플(합성) 데이터입니다 — 실제 데이터 파이프라인 연동 전 자리표시자';
    banner.style.display = 'inline-flex';
  } else if (emptySectors.length > 0) {
    banner.textContent = `⚠ ${DATA.sectors.length - emptySectors.length}/${DATA.sectors.length}개 세부업종만 실데이터 수집됨 — 미수집: ${emptySectors.map(s => s.name_kr).join(', ')} (ETF 티커 미설정)`;
    banner.style.display = 'inline-flex';
  }

  buildSortOptions();
  buildFilterPanel();
  renderSummary();
  render();

  document.getElementById('latestSortBtn').onclick = () => {
    sortMode = DATA.months[DATA.months.length - 1];
    document.getElementById('sortSelect').value = sortMode;
    render();
  };
  document.getElementById('exportBtn').onclick = exportCsv;
}

loadData();

// 최후의 안전장치: 무슨 이유로든 4초 안에 렌더링이 시작되지 않으면 강제로 폴백 데이터를 그린다.
setTimeout(() => {
  if (!DATA) {
    DATA = FALLBACK_DATA;
    init();
  }
}, 4000);
</script>
